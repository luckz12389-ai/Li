name: Unzip e Build Android

on:
  workflow_dispatch:

jobs:
  unzip-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          ls -la
          test -f Amazon_Frontline_Complete.zip || { echo "ZIP nao encontrado"; exit 1; }

      - name: Descompactar
        run: |
          unzip -o Amazon_Frontline_Complete.zip
          test -d Amazon_Frontline
          ls Amazon_Frontline | head

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Licencas
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" | head

      - name: Download Godot 4.3 + templates
        run: |
          mkdir -p godot
          cd godot
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -o godot.zip
          BIN=$(find . -maxdepth 1 -type f -name "Godot*" | head -1)
          mv "$BIN" godot
          chmod +x godot
          ./godot --version || true
          curl -fsSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -o templates.tpz -d /tmp/godot_tpl
          cp -r /tmp/godot_tpl/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          echo "=== Templates instalados ==="
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configurar Godot + preset Android
        run: |
          mkdir -p "$HOME/.config/godot"
          # settings do editor
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" << EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$(pwd)/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.3.tres" "$HOME/.config/godot/editor_settings-4.tres" || true

          # keystore
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Ajustar export_presets: desligar gradle (mais simples no CI) e apontar keystore
          cd Amazon_Frontline
          sed -i 's|gradle_build/use_gradle_build=true|gradle_build/use_gradle_build=false|g' export_presets.cfg || true
          sed -i 's|export_path="build/android/AmazonFrontline.apk"|export_path="build/android/AmazonFrontline.apk"|g' export_presets.cfg || true
          # garantir pastas
          mkdir -p build/android
          echo "=== export_presets (trecho) ==="
          head -40 export_presets.cfg

      - name: Exportar APK
        working-directory: Amazon_Frontline
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p build/android
          # tenta export debug
          ../godot/godot --headless --verbose --path . --export-debug "Android" "$(pwd)/build/android/AmazonFrontline.apk" 2>&1 | tee export.log || true
          echo "==== arquivos em build/android ===="
          ls -la build/android/ || true
          echo "==== ultimas 80 linhas do log ===="
          tail -80 export.log || true
          if [ ! -f build/android/AmazonFrontline.apk ]; then
            echo "APK nao gerado" > build/android/BUILD_NOTES.txt
            cp export.log build/android/
            # tambem sobe o project para diagnostico
            cp export_presets.cfg build/android/ || true
          fi

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: AmazonFrontline-Android
          path: Amazon_Frontline/build/android/
          retention-days: 14
          if-no-files-found: warn
