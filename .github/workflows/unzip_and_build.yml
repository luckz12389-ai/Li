name: Unzip e Build Android

on:
  workflow_dispatch:

jobs:
  unzip-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          ls -la
          test -f Amazon_Frontline_Complete.zip || { echo "ZIP nao encontrado"; exit 1; }

      - name: Descompactar
        run: |
          unzip -o Amazon_Frontline_Complete.zip
          test -d Amazon_Frontline

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Licencas
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Download Godot 4.3 + templates
        run: |
          mkdir -p godot
          cd godot
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -o godot.zip
          BIN=$(find . -maxdepth 1 -type f -name "Godot*" | head -1)
          mv "$BIN" godot
          chmod +x godot
          curl -fsSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -o templates.tpz -d /tmp/godot_tpl
          cp -r /tmp/godot_tpl/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          ls "$HOME/.local/share/godot/export_templates/4.3.stable/" | head

      - name: Corrigir projeto para export
        run: |
          # keystore debug
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" << EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$(pwd)/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.3.tres" "$HOME/.config/godot/editor_settings-4.tres" || true

          cd Amazon_Frontline

          # 1) Desligar Gradle e REMOVER min/target SDK (causa do erro)
          sed -i 's|gradle_build/use_gradle_build=true|gradle_build/use_gradle_build=false|g' export_presets.cfg
          sed -i '/gradle_build\/min_sdk/d' export_presets.cfg
          sed -i '/gradle_build\/target_sdk/d' export_presets.cfg

          # 2) Remover icone corrompido
          rm -f assets/ui/icon.png
          sed -i '/config\/icon=/d' project.godot || true

          # 3) Criar PNG minimo valido (1x1 pixel)
          mkdir -p assets/ui
          python3 - << 'PY'
          import struct, zlib
          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
          raw = b"\x00" + b"\x00\xff\x00"  # filter + RGB green
          ihdr = struct.pack(">IIBBBBB", 1, 1, 8, 2, 0, 0, 0)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("assets/ui/icon.png", "wb").write(png)
          print("icon.png ok", len(png))
          PY

          mkdir -p build/android
          echo "=== preset Android (primeiras linhas) ==="
          head -50 export_presets.cfg

      - name: Exportar APK
        working-directory: Amazon_Frontline
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p build/android
          ../godot/godot --headless --path . --export-debug "Android" "$(pwd)/build/android/AmazonFrontline.apk" 2>&1 | tee export.log || true
          echo "==== build/android ===="
          ls -la build/android/ || true
          echo "==== tail log ===="
          tail -60 export.log || true
          if [ ! -f build/android/AmazonFrontline.apk ]; then
            echo "APK nao gerado" > build/android/BUILD_NOTES.txt
            cp export.log build/android/
          fi

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: AmazonFrontline-Android
          path: Amazon_Frontline/build/android/
          retention-days: 14
          if-no-files-found: warn
