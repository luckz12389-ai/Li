name: Unzip e Build Android

on:
  workflow_dispatch:

jobs:
  unzip-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          echo "Arquivos na raiz:"
          ls -la
          if [ ! -f Amazon_Frontline_Complete.zip ]; then
            echo "ERRO: Amazon_Frontline_Complete.zip nao esta na raiz do repositorio."
            exit 1
          fi

      - name: Descompactar
        run: |
          unzip -o Amazon_Frontline_Complete.zip
          test -d Amazon_Frontline || { echo "Pasta Amazon_Frontline nao encontrada"; exit 1; }
          echo "OK - projeto descompactado"
          ls Amazon_Frontline | head -20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licencas (metodo direto)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$ANDROID_HOME/licenses/google-gdk-license"
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Download Godot 4.3 + templates
        run: |
          mkdir -p godot
          cd godot
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -o godot.zip
          GODOT_BIN=$(find . -maxdepth 1 -type f -name "Godot*" | head -1)
          mv "$GODOT_BIN" godot
          chmod +x godot
          curl -fsSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -o templates.tpz -d /tmp/godot_tpl
          cp -r /tmp/godot_tpl/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          echo "Templates:"
          ls "$HOME/.local/share/godot/export_templates/4.3.stable/" | head

      - name: Configurar Godot Android SDK path
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" << EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          # tambem versao 4.3
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.3.tres" || true

      - name: Keystore debug
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Exportar APK
        working-directory: Amazon_Frontline
        run: |
          mkdir -p build/android
          ../godot/godot --headless --path . --export-debug "Android" build/android/AmazonFrontline.apk 2>&1 | tee export.log
          echo "==== resultado ===="
          ls -la build/android/ || true
          if [ ! -f build/android/AmazonFrontline.apk ]; then
            echo "APK nao gerado. Conteudo do log:"
            cat export.log || true
            echo "Godot Android export falhou neste ambiente." > build/android/BUILD_NOTES.txt
            cp export.log build/android/ || true
          fi

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: AmazonFrontline-Android
          path: Amazon_Frontline/build/android/
          retention-days: 14
          if-no-files-found: warn
